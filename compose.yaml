services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ibov-momentum:latest
    container_name: ibov-momentum
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PYTHON_BIN: /opt/venv/bin/python
      PROPHET_SCRIPT_PATH: /app/scripts/run_prophet.py
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
